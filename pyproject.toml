[project]
name = "deploying-scalable-ml-pipeline-in-production-project"
version = "0.1.0"
description = "Final project deploying scalable ml pipeline in production"
authors = [
    {name = "Dan"}
]
readme = "README.md"
requires-python = ">= 3.12"
dependencies = [
    "fastapi (==0.117.1)",
    "uvicorn[standard] (==0.36.0)",
    "pydantic (==2.11.9)",
    "pytest (==8.4.2)",
    "pytest-asyncio (==1.2.0)",
    "httpx (==0.28.1)",
    "requests (==2.32.5)",
    "pandas (==2.3.2)",
    "numpy (==2.3.3)",
    "matplotlib (==3.10.6)",
    "seaborn (==0.13.2)",
    "scikit-learn (==1.7.2)",
    "jupyter (==1.1.1)",
    "aequitas (==0.42.0)",
    "altair (==4.1.0)",
    "flask (==0.12.2)",
    "flask-bootstrap (==3.3.7.1)",
    "python-multipart (==0.0.20)",
    "httplib2 (==0.31.0)"
]

[tool.poetry.group.dev.dependencies]
flake8 = "7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
